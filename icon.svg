<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b3310"/>
      <stop offset="100%" style="stop-color:#3d1800"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f5c56a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f5c56a;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- ラジオ本体 -->
  <rect x="48" y="100" width="416" height="280" rx="20" fill="#8b4a18" opacity="0.9"/>
  <rect x="60" y="112" width="392" height="256" rx="16" fill="#5c2a0a"/>

  <!-- ダイヤルエリア -->
  <rect x="72" y="124" width="260" height="160" rx="10" fill="#050200"/>
  <rect x="72" y="124" width="260" height="160" rx="10" fill="url(#glow)"/>
  <!-- ダイヤル内の横線 -->
  <rect x="90" y="170" width="224" height="3" rx="1" fill="#f5c56a" opacity="0.4"/>
  <rect x="90" y="185" width="180" height="2" rx="1" fill="#f5c56a" opacity="0.25"/>
  <rect x="90" y="198" width="200" height="2" rx="1" fill="#f5c56a" opacity="0.2"/>

  <!-- 周波数メモリ -->
  <text x="202" y="155" text-anchor="middle"
    font-family="'Courier New',monospace"
    font-size="18" fill="#f5c56a" opacity="0.8">SW 810kHz</text>

  <!-- ノート記号 -->
  <text x="202" y="245" text-anchor="middle" font-size="48" fill="#e8a840" opacity="0.5">♪</text>

  <!-- ダイヤルノブ（右） -->
  <circle cx="370" cy="160" r="36" fill="radial-gradient(circle, #8b5a1a, #3d1800)"/>
  <circle cx="370" cy="160" r="36" fill="#4a2208"/>
  <circle cx="370" cy="160" r="28" fill="#3d1a06"/>
  <circle cx="370" cy="160" r="6" fill="#f5c56a" opacity="0.5"/>

  <!-- ダイヤルノブ（右下） -->
  <circle cx="370" cy="240" r="28" fill="#4a2208"/>
  <circle cx="370" cy="240" r="20" fill="#3d1a06"/>
  <circle cx="370" cy="240" r="5" fill="#f5c56a" opacity="0.4"/>

  <!-- スピーカーグリル -->
  <rect x="60" y="292" width="392" height="56" rx="8" fill="#3d1800"/>
  <!-- グリル穴 -->
  <circle cx="100" cy="320" r="4" fill="#1a0800"/>
  <circle cx="120" cy="320" r="4" fill="#1a0800"/>
  <circle cx="140" cy="320" r="4" fill="#1a0800"/>
  <circle cx="160" cy="320" r="4" fill="#1a0800"/>
  <circle cx="180" cy="320" r="4" fill="#1a0800"/>
  <circle cx="200" cy="320" r="4" fill="#1a0800"/>
  <circle cx="220" cy="320" r="4" fill="#1a0800"/>
  <circle cx="240" cy="320" r="4" fill="#1a0800"/>
  <circle cx="260" cy="320" r="4" fill="#1a0800"/>
  <circle cx="280" cy="320" r="4" fill="#1a0800"/>
  <circle cx="300" cy="320" r="4" fill="#1a0800"/>
  <circle cx="320" cy="320" r="4" fill="#1a0800"/>
  <circle cx="340" cy="320" r="4" fill="#1a0800"/>
  <circle cx="360" cy="320" r="4" fill="#1a0800"/>
  <circle cx="380" cy="320" r="4" fill="#1a0800"/>
  <circle cx="400" cy="320" r="4" fill="#1a0800"/>
  <circle cx="420" cy="320" r="4" fill="#1a0800"/>

  <!-- ブランド文字 -->
  <text x="256" y="448" text-anchor="middle"
    font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif"
    font-size="36" font-weight="bold" fill="#f5c56a" letter-spacing="4"
    text-shadow="0 0 10px #f5c56a">昭和青春ラジオ</text>
</svg>
